# Minimal custom PostgreSQL config, loaded with `postgres -c config_file=...`.
# Anything not set here uses the built-in defaults. Reference:
# https://www.postgresql.org/docs/18/runtime-config.html

listen_addresses = '*'             # required so the published port is reachable
max_connections = 100
shared_buffers = 256MB
work_mem = 8MB
timezone = 'UTC'
log_timezone = 'UTC'
log_min_duration_statement = 500   # log statements slower than 500 ms
