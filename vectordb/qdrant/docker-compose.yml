# Qdrant: vector database / similarity search engine written in Rust.
name: qdrant

services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.20.0}
    container_name: qdrant
    restart: unless-stopped
    environment:
      # Empty = no auth. Set a key to require `api-key: <key>` on every request.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant-storage:/qdrant/storage
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"   # REST + web UI (/dashboard)
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC
    healthcheck:
      # The image has bash but no curl/wget: probe /readyz over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *200* ]]"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  qdrant-storage:
