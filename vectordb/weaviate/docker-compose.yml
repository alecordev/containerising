# Weaviate: vector database with hybrid search and optional vectorizer modules.
# Anonymous access, no vectorizer: bring your own vectors (enable a module + API key to use hosted embedders).
name: weaviate

services:
  weaviate:
    image: semitechnologies/weaviate:${WEAVIATE_VERSION:-1.40.5}
    container_name: weaviate
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ${WEAVIATE_MODULES:-}
      CLUSTER_HOSTNAME: node1
      DISABLE_TELEMETRY: "true"
      # Only used when the matching module is enabled (e.g. WEAVIATE_MODULES=text2vec-openai)
      OPENAI_APIKEY: ${OPENAI_APIKEY:-}
    volumes:
      - weaviate-data:/var/lib/weaviate
    ports:
      - "${WEAVIATE_HTTP_PORT:-8080}:8080"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  weaviate-data:
