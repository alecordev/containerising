# Prefect 3 server (API + UI) backed by PostgreSQL. Local development only.
# Replaces the Prefect 1.x Server/Hasura/Apollo stack, which is discontinued.
services:
    postgres:
        image: postgres:18-alpine
        container_name: prefect-postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-prefect}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prefect}
            POSTGRES_DB: ${POSTGRES_DB:-prefect}
        volumes:
            # postgres >= 18 keeps its (versioned) data dir below /var/lib/postgresql
            - postgres-data:/var/lib/postgresql
        networks:
            - prefect
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    server:
        image: prefecthq/prefect:${PREFECT_VERSION:-3.9.2-python3.13}
        container_name: prefect-server
        command: prefect server start --host 0.0.0.0 --port 4200
        environment:
            PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-prefect}:${POSTGRES_PASSWORD:-prefect}@postgres:5432/${POSTGRES_DB:-prefect}
            PREFECT_SERVER_API_HOST: 0.0.0.0
            # URL the browser uses to reach the API (the UI calls it from your machine)
            PREFECT_UI_API_URL: http://localhost:${PREFECT_PORT:-4200}/api
            PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        ports:
            - "${PREFECT_PORT:-4200}:4200"
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - prefect
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=4)"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        restart: unless-stopped

    # Optional: a process worker polling the `default` work pool (profile `worker`).
    # Create the pool first: docker compose run --rm server prefect work-pool create default --type process
    worker:
        image: prefecthq/prefect:${PREFECT_VERSION:-3.9.2-python3.13}
        container_name: prefect-worker
        profiles:
            - worker
        command: prefect worker start --pool default --type process
        environment:
            PREFECT_API_URL: http://server:4200/api
        volumes:
            - ./example:/opt/prefect/flows
        depends_on:
            server:
                condition: service_healthy
        networks:
            - prefect
        restart: unless-stopped

networks:
    prefect:
        name: prefect

volumes:
    postgres-data:
