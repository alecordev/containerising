# Garage single-node dev configuration.
# Secrets are NOT in this file: GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN and
# GARAGE_METRICS_TOKEN come from the environment (see docker-compose.yml / .env.example).

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# Single node: no replication. Use 3 (and 3 nodes) for a real cluster.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
# Address other containers (the init job) use to reach this node
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
