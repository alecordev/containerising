services:
    jupyterlab:
        build:
            context: .
            args:
                UID: ${HOST_UID:-1000}
                GID: ${HOST_GID:-1000}
        image: jupyterlab-local
        container_name: jupyterlab
        ports:
            # Published on loopback only: with an empty JUPYTER_TOKEN there is no authentication
            - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
        environment:
            # Empty = no token (fine on localhost). Set a value to require it: http://localhost:8888/lab?token=...
            JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
        volumes:
            - ./notebooks:/home/jupyter/notebooks
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/lab', timeout=4)"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
        restart: unless-stopped
