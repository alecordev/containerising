services:
    traefik:
        image: traefik:${TRAEFIK_VERSION:-v3.7.18}
        container_name: traefik
        command:
            - --api.dashboard=true
            # Dashboard + ping on the internal :8080 entrypoint. "insecure" = no auth: dev only.
            - --api.insecure=true
            - --ping=true
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --providers.docker.network=${TRAEFIK_NETWORK:-proxy}
            - --providers.file.directory=/etc/traefik/dynamic
            - --providers.file.watch=true
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
            - --accesslog=true
        ports:
            - "${TRAEFIK_HTTP_PORT:-80}:80"
            - "${TRAEFIK_HTTPS_PORT:-443}:443"
            - "${TRAEFIK_DASHBOARD_PORT:-8088}:8080"
        volumes:
            # SECURITY: read-only socket access still exposes container metadata and lets
            # anything that compromises Traefik enumerate (and via the API, inspect) containers.
            # Fine locally; use a docker-socket-proxy in shared environments.
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./dynamic:/etc/traefik/dynamic:ro
            - ./certs:/certs:ro
        networks:
            - proxy
        healthcheck:
            test: ["CMD", "traefik", "healthcheck", "--ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        restart: unless-stopped

    # Demo upstream: http://whoami.localhost (and https://whoami.localhost).
    # The image is `scratch` (no shell, no healthcheck flag), so it has no healthcheck.
    whoami:
        image: traefik/whoami:${WHOAMI_VERSION:-v1.12.0}
        container_name: whoami
        labels:
            - traefik.enable=true
            - traefik.http.routers.whoami.rule=Host(`whoami.localhost`)
            - traefik.http.routers.whoami.entrypoints=web,websecure
            - traefik.http.routers.whoami.tls=false
            - traefik.http.routers.whoami-secure.rule=Host(`whoami.localhost`)
            - traefik.http.routers.whoami-secure.entrypoints=websecure
            - traefik.http.routers.whoami-secure.tls=true
            - traefik.http.services.whoami.loadbalancer.server.port=80
        networks:
            - proxy
        restart: unless-stopped

networks:
    # Other stacks join this network (declare it `external: true` there) and add Traefik labels.
    proxy:
        name: ${TRAEFIK_NETWORK:-proxy}
