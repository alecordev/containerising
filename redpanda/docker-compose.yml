# Single-node Redpanda (Kafka API compatible, no JVM/ZooKeeper) + Redpanda Console.
# Dual listeners like the kafka/ templates: INTERNAL for containers (redpanda:9092),
# EXTERNAL for the host (localhost:19092). Set REDPANDA_EXTERNAL_HOST when clients connect from other machines.
name: redpanda

services:
  redpanda:
    image: redpandadata/redpanda:${REDPANDA_VERSION:-v26.2.6}
    container_name: redpanda
    hostname: redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=${REDPANDA_MEMORY:-1G}
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://${REDPANDA_EXTERNAL_HOST:-localhost}:${REDPANDA_KAFKA_PORT:-19092}
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://${REDPANDA_EXTERNAL_HOST:-localhost}:${REDPANDA_PROXY_PORT:-18082}
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"            # Kafka API (host listener)
      - "${REDPANDA_PROXY_PORT:-18082}:18082"            # HTTP Proxy (pandaproxy)
      - "${REDPANDA_SCHEMA_REGISTRY_PORT:-18081}:18081"  # Schema Registry
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"              # Admin API
    networks:
      - redpanda-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  console:
    image: redpandadata/console:${REDPANDA_CONSOLE_VERSION:-v3.14.0}
    container_name: redpanda-console
    restart: unless-stopped
    # Console reads a YAML config file; it is injected inline via an env var.
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8085}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - redpanda-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/admin/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  redpanda-data:

networks:
  redpanda-net:
    name: redpanda-net
