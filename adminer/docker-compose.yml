services:
    adminer:
        image: adminer:${ADMINER_VERSION:-6.3.0-standalone}
        container_name: adminer
        ports:
            - "${ADMINER_PORT:-8082}:8080"
        environment:
            ADMINER_DEFAULT_SERVER: ${ADMINER_DEFAULT_SERVER:-postgres}
            ADMINER_DESIGN: ${ADMINER_DESIGN:-pepa-linha}
        networks:
            - dbnet
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        restart: unless-stopped

    # Optional throwaway database to try Adminer: docker compose --profile demo up -d --wait
    demo-postgres:
        profiles: [demo]
        image: postgres:${DEMO_POSTGRES_VERSION:-18.6-alpine}
        container_name: adminer-demo-postgres
        environment:
            POSTGRES_USER: demo
            POSTGRES_PASSWORD: demo
            POSTGRES_DB: demo
        volumes:
            - demo-postgres-data:/var/lib/postgresql
        networks:
            dbnet:
                aliases: [demo-postgres]
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

networks:
    # Shared network for database UIs. Other stacks join it with `external: true` (see README).
    dbnet:
        name: ${DBNET_NAME:-dbnet}

volumes:
    demo-postgres-data:
