# LGTM-style observability stack: Grafana + Loki (logs) + Tempo (traces) + Prometheus (metrics),
# fed through one OpenTelemetry Collector (OTLP in). Local development only.
#
# Loki, Tempo and the Collector images are distroless (no shell, curl or wget), so they cannot carry
# their own healthcheck. `ready` is a tiny busybox job that polls their readiness endpoints; Grafana and
# the Collector wait for it. Port clash: Grafana defaults to 3000 and Prometheus to 9090 like the
# `grafana/` template - override GRAFANA_PORT / PROMETHEUS_PORT to run both.
services:
    # One-shot: the Loki/Tempo images run as uid 10001; make the fresh named volumes writable for them.
    init:
        image: busybox:${BUSYBOX_VERSION:-1.37}
        container_name: observability-init
        command: ["chown", "-R", "10001:10001", "/loki", "/var/tempo"]
        user: "0:0"
        volumes:
            - loki-data:/loki
            - tempo-data:/var/tempo
        networks:
            - observability
        restart: "no"

    loki:
        image: grafana/loki:${LOKI_VERSION:-3.7.9}
        container_name: loki
        command: ["-config.file=/etc/loki/loki.yaml"]
        ports:
            - "127.0.0.1:${LOKI_PORT:-3100}:3100"
        volumes:
            - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
            - loki-data:/loki
        depends_on:
            init:
                condition: service_completed_successfully
        networks:
            - observability
        restart: unless-stopped

    tempo:
        image: grafana/tempo:${TEMPO_VERSION:-2.10.10}
        container_name: tempo
        command: ["-config.file=/etc/tempo/tempo.yaml"]
        ports:
            - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
        volumes:
            - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
            - tempo-data:/var/tempo
        depends_on:
            init:
                condition: service_completed_successfully
        networks:
            - observability
        restart: unless-stopped

    prometheus:
        image: prom/prometheus:${PROMETHEUS_VERSION:-v3.16.0}
        container_name: prometheus
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
            # the Collector pushes metrics here (incl. span metrics derived from traces)
            - --web.enable-remote-write-receiver
            - --enable-feature=exemplar-storage
        ports:
            - "${PROMETHEUS_PORT:-9090}:9090"
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus-data:/prometheus
        networks:
            - observability
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s
        restart: unless-stopped

    # One-shot readiness gate for the distroless backends (busybox wget).
    ready:
        image: busybox:${BUSYBOX_VERSION:-1.37}
        container_name: observability-ready
        depends_on:
            loki:
                condition: service_started
            tempo:
                condition: service_started
            prometheus:
                condition: service_healthy
        command:
            - sh
            - -c
            - |
                for url in http://loki:3100/ready http://tempo:3200/ready; do
                    i=0
                    until wget -q -O /dev/null "$$url"; do
                        i=$$((i + 1))
                        [ "$$i" -ge 90 ] && { echo "timeout waiting for $$url" >&2; exit 1; }
                        sleep 2
                    done
                    echo "ready: $$url"
                done
        networks:
            - observability
        restart: "no"

    otel-collector:
        image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION:-0.165.0}
        container_name: otel-collector
        command: ["--config=/etc/otelcol/config.yaml"]
        ports:
            # OTLP receivers: point your applications / SDKs here
            - "${OTLP_GRPC_PORT:-4317}:4317"
            - "${OTLP_HTTP_PORT:-4318}:4318"
            # health_check extension (no healthcheck in compose: the image has no shell)
            - "127.0.0.1:${OTELCOL_HEALTH_PORT:-13133}:13133"
        volumes:
            - ./otel-collector/otel-collector.yaml:/etc/otelcol/config.yaml:ro
        depends_on:
            ready:
                condition: service_completed_successfully
        networks:
            - observability
        restart: unless-stopped

    grafana:
        image: grafana/grafana:${GRAFANA_VERSION:-13.2.6}
        container_name: observability-grafana
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_ANALYTICS_REPORTING_ENABLED: "false"
            GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
        ports:
            - "${GRAFANA_PORT:-3000}:3000"
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            - grafana-data:/var/lib/grafana
        depends_on:
            ready:
                condition: service_completed_successfully
        networks:
            - observability
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        restart: unless-stopped

networks:
    observability:
        name: observability

volumes:
    loki-data:
    tempo-data:
    prometheus-data:
    grafana-data:
