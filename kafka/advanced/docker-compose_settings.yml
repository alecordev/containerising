# Single-node KRaft broker showing commonly tuned broker settings, all driven by env vars.
# Any broker property can be set as KAFKA_<PROPERTY_WITH_DOTS_AS_UNDERSCORES> (upper-case).
# Run: docker compose -f docker-compose_settings.yml up -d
name: kafka-settings

services:
    kafka:
        image: apache/kafka:${KAFKA_VERSION:-4.4.0}
        container_name: kafka-settings
        hostname: kafka
        ports:
            - "${KAFKA_PORT:-9092}:9092"
        environment:
            CLUSTER_ID: ${CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_PORT:-9092}
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            # ---- tuning examples ----
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS:-false}
            KAFKA_DELETE_TOPIC_ENABLE: "true"
            KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-6}
            KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
            KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:--1}
            KAFKA_LOG_SEGMENT_BYTES: 268435456
            KAFKA_COMPRESSION_TYPE: ${KAFKA_COMPRESSION_TYPE:-producer}
            KAFKA_MESSAGE_MAX_BYTES: ${KAFKA_MESSAGE_MAX_BYTES:-10485880}
            KAFKA_REPLICA_FETCH_MAX_BYTES: ${KAFKA_MESSAGE_MAX_BYTES:-10485880}
            KAFKA_NUM_NETWORK_THREADS: 3
            KAFKA_NUM_IO_THREADS: 8
            KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx1G -Xms1G}
        volumes:
            - kafka-data:/var/lib/kafka/data
        healthcheck:
            test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 30s
        restart: unless-stopped

volumes:
    kafka-data:
