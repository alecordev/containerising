# 3-node KRaft cluster (every node is broker+controller) + Kafka UI.
# Run: docker compose -f docker-compose_cluster.yml up -d
# Host ports: 9092 / 9094 / 9096 -> kafka-1 / kafka-2 / kafka-3 (EXTERNAL listeners).
name: kafka-cluster

x-kafka-common: &kafka-common
    image: apache/kafka:${KAFKA_VERSION:-4.4.0}
    networks:
        - kafka
    restart: unless-stopped
    healthcheck:
        test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
        interval: 15s
        timeout: 10s
        retries: 10
        start_period: 40s

x-kafka-env: &kafka-env
    CLUSTER_ID: ${CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

services:
    kafka-1:
        <<: *kafka-common
        container_name: kafka-1
        hostname: kafka-1
        ports:
            - "${KAFKA_1_PORT:-9092}:9092"
        environment:
            <<: *kafka-env
            KAFKA_NODE_ID: 1
            KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_1_PORT:-9092}
        volumes:
            - kafka-1-data:/var/lib/kafka/data

    kafka-2:
        <<: *kafka-common
        container_name: kafka-2
        hostname: kafka-2
        ports:
            - "${KAFKA_2_PORT:-9094}:9092"
        environment:
            <<: *kafka-env
            KAFKA_NODE_ID: 2
            KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_2_PORT:-9094}
        volumes:
            - kafka-2-data:/var/lib/kafka/data

    kafka-3:
        <<: *kafka-common
        container_name: kafka-3
        hostname: kafka-3
        ports:
            - "${KAFKA_3_PORT:-9096}:9092"
        environment:
            <<: *kafka-env
            KAFKA_NODE_ID: 3
            KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_3_PORT:-9096}
        volumes:
            - kafka-3-data:/var/lib/kafka/data

    kafka-ui:
        image: kafbat/kafka-ui:${KAFKA_UI_VERSION:-v1.5.0}
        container_name: kafka-ui-cluster
        networks:
            - kafka
        ports:
            - "${KAFKA_UI_PORT:-8090}:8080"
        environment:
            KAFKA_CLUSTERS_0_NAME: cluster
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
            DYNAMIC_CONFIG_ENABLED: "true"
        depends_on:
            kafka-1:
                condition: service_healthy
            kafka-2:
                condition: service_healthy
            kafka-3:
                condition: service_healthy
        restart: unless-stopped

networks:
    kafka:
        name: kafka-cluster

volumes:
    kafka-1-data:
    kafka-2-data:
    kafka-3-data:
