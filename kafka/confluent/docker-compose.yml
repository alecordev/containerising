# Confluent Platform (community images) in KRaft mode: cp-kafka + Schema Registry.
# The old ZooKeeper, ksqlDB 0.20 and Control Center 6.x services are gone: Control Center is now a
# separate "next-gen" product that needs Prometheus. Use Kafka UI (see ../advanced) for a UI.
services:
    kafka:
        image: confluentinc/cp-kafka:${CP_VERSION:-8.3.3}
        container_name: cp-kafka
        hostname: kafka
        ports:
            - "${KAFKA_PORT:-9092}:9092"
        environment:
            CLUSTER_ID: ${CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
            KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_PORT:-9092}
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        volumes:
            - kafka-data:/var/lib/kafka/data
        healthcheck:
            test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 40s
        restart: unless-stopped

    schema-registry:
        image: confluentinc/cp-schema-registry:${CP_VERSION:-8.3.3}
        container_name: cp-schema-registry
        hostname: schema-registry
        depends_on:
            kafka:
                condition: service_healthy
        ports:
            - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
        environment:
            SCHEMA_REGISTRY_HOST_NAME: schema-registry
            SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
            SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
        healthcheck:
            test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8081/subjects', timeout=5)"]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 20s
        restart: unless-stopped

volumes:
    kafka-data:
