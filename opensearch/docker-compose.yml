# OpenSearch + OpenSearch Dashboards, single node.
# Local development only: the security plugin (TLS + auth) is DISABLED by default.
name: opensearch

services:
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.9.0}
    container_name: opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}
      # The entrypoint refuses to start without a strong initial admin password even
      # when the security plugin is disabled (min 8 chars, upper/lower/digit/special).
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-Dev-Opensearch-9!}
      - DISABLE_SECURITY_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "${OPENSEARCH_PERF_PORT:-9600}:9600"
    networks:
      - opensearch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION:-3.9.0}
    container_name: opensearch-dashboards
    restart: unless-stopped
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}
    ports:
      - "${DASHBOARDS_PORT:-5602}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - opensearch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  opensearch-data:

networks:
  opensearch-net:
    name: opensearch-net
