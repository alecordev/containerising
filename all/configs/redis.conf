# Minimal Redis config for local development.
# The password is NOT set here: docker-compose passes --requirepass from $REDIS_PASSWORD.
# Full reference: https://redis.io/docs/latest/operate/oss_and_stack/management/config/

bind 0.0.0.0 -::*
protected-mode yes
port 6379

# Persistence (data dir is the mounted volume)
dir /data
appendonly yes
save 900 1
save 300 10
save 60 10000

# Memory: evict least-recently-used keys instead of failing writes
maxmemory 256mb
maxmemory-policy allkeys-lru

loglevel notice
