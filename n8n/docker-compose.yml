# n8n (workflow automation) on PostgreSQL. Local development only.
services:
    postgres:
        image: postgres:18-alpine
        container_name: n8n-postgres
        environment:
            POSTGRES_USER: ${N8N_DB_USER:-n8n}
            POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
            POSTGRES_DB: ${N8N_DB_NAME:-n8n}
        volumes:
            # postgres >= 18 keeps its (versioned) data dir below /var/lib/postgresql
            - postgres-data:/var/lib/postgresql
        networks:
            - n8n
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    n8n:
        image: n8nio/n8n:${N8N_VERSION:-2.48.2}
        container_name: n8n
        environment:
            DB_TYPE: postgresdb
            DB_POSTGRESDB_HOST: postgres
            DB_POSTGRESDB_PORT: "5432"
            DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
            DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
            DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
            # Encrypts credentials stored in the database. Set your own and never change it afterwards.
            N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-only-change-me-n8n-encryption-key}
            N8N_HOST: localhost
            N8N_PORT: "5678"
            N8N_PROTOCOL: http
            # base URL n8n shows for webhook endpoints
            WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
            # plain-HTTP local access; keep true behind HTTPS
            N8N_SECURE_COOKIE: "false"
            GENERIC_TIMEZONE: ${TZ:-UTC}
            TZ: ${TZ:-UTC}
            N8N_DIAGNOSTICS_ENABLED: "false"
            N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
            N8N_PERSONALIZATION_ENABLED: "false"
        ports:
            - "${N8N_PORT:-5678}:5678"
        volumes:
            - n8n-data:/home/node/.n8n
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - n8n
        healthcheck:
            # /healthz/readiness also checks the database connection
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5678/healthz/readiness"]
            interval: 10s
            timeout: 5s
            retries: 15
            start_period: 30s
        restart: unless-stopped

networks:
    n8n:

volumes:
    postgres-data:
    n8n-data:
