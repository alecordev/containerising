# Telegraf configuration -> InfluxDB 2. Values come from the container environment (see docker-compose.yml).
# Reference for all plugins: https://docs.influxdata.com/telegraf/latest/configure_plugins/

[global_tags]

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  # empty = use the container hostname
  hostname = ""
  omit_hostname = false

###############################################################################
#                            OUTPUTS                                          #
###############################################################################

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_ADMIN_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  timeout = "5s"

###############################################################################
#                            INPUTS                                           #
###############################################################################

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.kernel]]

[[inputs.mem]]

[[inputs.processes]]

[[inputs.swap]]

[[inputs.system]]

# Network reachability (the old config pinned private LAN IPs; edit to taste).
[[inputs.ping]]
  interval = "60s"
  urls = ["google.com", "github.com"]
  count = 4
  ping_interval = 1.0
  timeout = 2.0
