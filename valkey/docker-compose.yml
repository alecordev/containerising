services:
  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-9.1.3-alpine}
    container_name: valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:-password}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - ${VALKEY_MAXMEMORY_POLICY:-allkeys-lru}
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-password}
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  valkey-data:
