services:
  scylla:
    image: scylladb/scylla:2026.3
    container_name: scylla
    restart: unless-stopped
    # Dev-friendly sizing: one shard, capped memory, no CPU pinning
    command: --smp ${SCYLLA_SMP:-1} --memory ${SCYLLA_MEMORY:-750M} --overprovisioned 1 --api-address 0.0.0.0
    ports:
      - "${SCYLLA_CQL_PORT:-9042}:9042"   # CQL
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

volumes:
  scylla-data:
